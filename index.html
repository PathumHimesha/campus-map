<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UOC Science Faculty - Interactive Map</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 10; }
        
        /* Mobile Drawer styles */
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 75vh;
                transform: translateY(100%); border-radius: 20px 20px 0 0;
            }
            #sidebar.open { transform: translateY(0); }
        }

        /* Dark mode overrides */
        .dark #sidebar { background-color: #1f2937; color: white; }
        .dark .leaflet-popup-content-wrapper { background-color: #374151; color: white; }
        .dark .leaflet-popup-tip { background-color: #374151; }

        /* Hide default routing text box */
        .leaflet-routing-container { display: none !important; }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">

    <!-- Top Navigation Bar -->
    <div class="absolute top-0 left-0 right-0 h-16 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-md z-40 flex items-center justify-between px-4">
        <h1 class="text-xl font-bold text-blue-700 dark:text-blue-400">
            <i class="fa-solid fa-graduation-cap mr-2"></i>Science Faculty Map
        </h1>
        <div class="flex gap-4">
            <!-- Layers Button -->
            <button onclick="toggleLayers()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 transition">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <!-- Dark Mode Button -->
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <!-- Mobile Menu Toggle Button -->
            <button onclick="toggleDrawer()" class="md:hidden p-2 rounded-full bg-blue-600 text-white hover:bg-blue-700 transition">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Sidebar / Drawer -->
    <div id="sidebar" class="absolute top-16 left-0 w-96 h-[calc(100vh-4rem)] bg-white shadow-2xl flex flex-col md:transform-none">
        
        <!-- Mobile Handle -->
        <div class="md:hidden w-full flex justify-center py-2" onclick="toggleDrawer()">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
        </div>

        <div class="p-4 border-b dark:border-gray-700">
            <input type="text" id="searchInput" placeholder="Search buildings, faculties..." 
                class="w-full p-3 rounded-xl border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-blue-500 transition mb-3"
                onkeyup="filterLocations()">
                
            <!-- Category Chips -->
            <div class="flex flex-wrap gap-2 overflow-x-auto pb-1" id="categoryChips">
                <button onclick="setCategory('All')" class="chip active px-3 py-1 rounded-full text-sm font-semibold bg-blue-600 text-white">All</button>
                <button onclick="setCategory('Academic')" class="chip px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">Academic</button>
                <button onclick="setCategory('Admin')" class="chip px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">Admin</button>
                <button onclick="setCategory('Services')" class="chip px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">Services</button>
            </div>
        </div>

        <!-- Location List / Details Panel -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4">
            <div id="locationList" class="space-y-3"></div>
            <div id="locationDetails" class="hidden h-full flex flex-col">
                <button onclick="showList()" class="mb-4 text-blue-600 dark:text-blue-400 font-semibold hover:underline">
                    <i class="fa-solid fa-arrow-left mr-2"></i>Back to list
                </button>
                <h2 id="detailTitle" class="text-2xl font-bold mb-2"></h2>
                <span id="detailCategory" class="text-sm font-bold px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md w-max mb-4"></span>
                <p id="detailDesc" class="text-gray-600 dark:text-gray-300 mb-4"></p>
                
                <h3 class="font-bold mb-2 border-b pb-1 dark:border-gray-700">Facilities</h3>
                <div id="detailFacilities" class="flex flex-wrap gap-2 mb-6"></div>
                
                <div class="mt-auto">
                    <button id="routeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 shadow-md">
                        <i class="fa-solid fa-route mr-2"></i>පාර පෙන්වන්න (Directions)
                    </button>
                    <div id="route-info" class="mt-3 text-center text-sm font-bold text-green-600 dark:text-green-400"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- 1. Map Initialization (Locked to Campus) ---
        const map = L.map('map', {
            zoomControl: false // Custom controls position later
        }).setView([6.9015, 79.8600], 17);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // Lock map boundaries to Colombo 07 Campus area
        const campusBounds = L.latLngBounds(
            L.latLng(6.896, 79.855), // South West
            L.latLng(6.906, 79.865)  // North East
        );
        map.setMaxBounds(campusBounds);
        map.on('drag', function() { map.panInsideBounds(campusBounds, { animate: false }); });

        // --- 2. Map Layers ---
        const streetsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, minZoom: 16, subdomains:['mt0','mt1','mt2','mt3']
        }).addTo(map);

        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20, minZoom: 16, subdomains:['mt0','mt1','mt2','mt3']
        });

        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20, minZoom: 16
        });

        let currentLayer = 'streets';
        function toggleLayers() {
            map.removeLayer(streetsLayer);
            map.removeLayer(satelliteLayer);
            map.removeLayer(darkLayer);

            if (currentLayer === 'streets') {
                satelliteLayer.addTo(map);
                currentLayer = 'satellite';
            } else if (currentLayer === 'satellite') {
                darkLayer.addTo(map);
                currentLayer = 'dark';
            } else {
                streetsLayer.addTo(map);
                currentLayer = 'streets';
            }
        }

        // --- 3. Locations Data ---
        const locations = [
            { id: 1, lat: 6.9012, lng: 79.8595, name: "Student Service Centre", category: "Services", desc: "Main student inquiries and administrative services.", facilities: ["Inquiry Desk", "Waiting Area"] },
            { id: 7, lat: 6.9025, lng: 79.8590, name: "Chemistry Lecture Theatre", category: "Academic", desc: "Main lecture hall for the Department of Chemistry.", facilities: ["Projector", "AC", "Whiteboard"] },
            { id: 11, lat: 6.9021, lng: 79.8601, name: "Natural History Museum", category: "Academic", desc: "University museum housing biological and zoological specimens.", facilities: ["Exhibits", "Guided Tours"] },
            { id: 16, lat: 6.9020, lng: 79.8615, name: "Department of Physics", category: "Academic", desc: "Physics laboratories and faculty offices.", facilities: ["Labs", "Workshops"] },
            { id: 19, lat: 6.9015, lng: 79.8610, name: "New Arts Theatre", category: "Theatres", desc: "Large auditorium for university events and lectures.", facilities: ["Stage", "Sound System", "Seating: 500+"] },
            { id: 21, lat: 6.9025, lng: 79.8620, name: "UCSC Building", category: "Academic", desc: "University of Colombo School of Computing.", facilities: ["Computer Labs", "Library", "Cafeteria"] },
            { id: 23, lat: 6.9018, lng: 79.8625, name: "Medical Centre", category: "Services", desc: "University healthcare and emergency services.", facilities: ["First Aid", "Doctor on call", "Pharmacy"] }
        ];

        let markers = [];
        let activeCategory = 'All';

        // Add markers to map
        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b><br><span class="text-xs text-gray-500">${loc.category}</span>`);
            marker.on('click', () => openDetail(loc));
            markers.push({ data: loc, marker: marker });
        });

        // --- 4. Sidebar & UI Logic ---
        const locationListEl = document.getElementById('locationList');
        
        function renderList(data) {
            locationListEl.innerHTML = '';
            if(data.length === 0) {
                locationListEl.innerHTML = '<p class="text-gray-500 text-center mt-10">No locations found.</p>';
                return;
            }
            data.forEach(loc => {
                const item = document.createElement('div');
                item.className = "p-4 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 transition border dark:border-gray-700 shadow-sm";
                item.innerHTML = `
                    <h3 class="font-bold text-lg">${loc.name}</h3>
                    <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 px-2 py-1 rounded">${loc.category}</span>
                `;
                item.onclick = () => {
                    map.flyTo([loc.lat, loc.lng], 19, { animate: true, duration: 1.5 });
                    openDetail(loc);
                };
                locationListEl.appendChild(item);
            });
        }

        function filterLocations() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = locations.filter(loc => 
                (activeCategory === 'All' || loc.category === activeCategory) &&
                (loc.name.toLowerCase().includes(term) || loc.category.toLowerCase().includes(term))
            );
            renderList(filtered);
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.remove('bg-blue-600', 'text-white');
                c.classList.add('bg-gray-200', 'text-gray-700', 'dark:bg-gray-700', 'dark:text-gray-200');
            });
            event.target.classList.remove('bg-gray-200', 'text-gray-700', 'dark:bg-gray-700', 'dark:text-gray-200');
            event.target.classList.add('bg-blue-600', 'text-white');
            filterLocations();
        }

        // --- 5. Detail View & Drawer ---
        function openDetail(loc) {
            document.getElementById('locationList').classList.add('hidden');
            document.getElementById('locationDetails').classList.remove('hidden');
            
            document.getElementById('detailTitle').innerText = loc.name;
            document.getElementById('detailCategory').innerText = loc.category;
            document.getElementById('detailDesc').innerText = loc.desc;
            
            const facHtml = loc.facilities.map(f => `<span class="px-2 py-1 bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300 rounded-full text-xs font-semibold">${f}</span>`).join('');
            document.getElementById('detailFacilities').innerHTML = facHtml;

            // Setup Routing Button
            const routeBtn = document.getElementById('routeBtn');
            routeBtn.onclick = () => showRoute(loc.lat, loc.lng);
            document.getElementById('route-info').innerText = '';

            // Open mobile drawer automatically
            document.getElementById('sidebar').classList.add('open');
        }

        function showList() {
            document.getElementById('locationDetails').classList.add('hidden');
            document.getElementById('locationList').classList.remove('hidden');
            if(routingControl) { map.removeControl(routingControl); }
        }

        function toggleDrawer() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // --- 6. Routing (Directions) ---
        let routingControl = null;
        let userLat = 6.9000; // Default: Reid Ave Entrance
        let userLng = 79.8588;

        // Try to get actual GPS if available
        map.locate({setView: false, maxZoom: 16});
        map.on('locationfound', function(e) {
            userLat = e.latlng.lat; userLng = e.latlng.lng;
        });

        window.showRoute = function(destLat, destLng) {
            if (routingControl) { map.removeControl(routingControl); }
            document.getElementById('route-info').innerText = "පාර හොයමින් පවතී... ⏳";

            routingControl = L.Routing.control({
                waypoints: [ L.latLng(userLat, userLng), L.latLng(destLat, destLng) ],
                router: L.Routing.osrmv1({ language: 'en', profile: 'foot' }), // Walking route
                lineOptions: { styles: [{color: '#3b82f6', opacity: 0.8, weight: 6}] },
                show: false, addWaypoints: false,
                createMarker: function() { return null; }
            }).on('routesfound', function(e) {
                let summary = e.routes[0].summary;
                let dist = summary.totalDistance < 1000 ? Math.round(summary.totalDistance) + ' m' : (summary.totalDistance / 1000).toFixed(1) + ' km';
                let time = Math.round(summary.totalTime / 60) + ' min';
                document.getElementById('route-info').innerHTML = `🚶 දුර: ${dist} | ⏱️ වෙලාව: ${time}`;
            }).addTo(map);

            if(window.innerWidth < 768) { toggleDrawer(); }
        };

        // --- 7. Dark Mode Logic ---
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            if(document.documentElement.classList.contains('dark')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                if(currentLayer === 'streets') { toggleLayers(); toggleLayers(); } // Switch to dark map
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                if(currentLayer === 'dark') { toggleLayers(); } // Switch to street map
            }
        }

        // Initialize List
        renderList(locations);
    </script>
</body>
</html>
