<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Navigator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 10; }
        
        /* Mobile Drawer styles */
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 75vh;
                transform: translateY(100%); border-radius: 20px 20px 0 0;
            }
            #sidebar.open { transform: translateY(0); }
        }

        /* Dark mode overrides */
        .dark #sidebar { background-color: #1f2937; color: white; }
        .dark .leaflet-popup-content-wrapper { background-color: #374151; color: white; }
        .dark .leaflet-popup-tip { background-color: #374151; }

        /* Hide default routing text box */
        .leaflet-routing-container { display: none !important; }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">

    <!-- Top Navigation Bar -->
    <div class="absolute top-0 left-0 right-0 h-16 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-md z-40 flex items-center justify-between px-4">
        <h1 class="text-xl font-bold text-blue-700 dark:text-blue-400">
            <i class="fa-solid fa-map-location-dot mr-2"></i>Campus Route Finder
        </h1>
        <div class="flex gap-4">
            <button onclick="toggleLayers()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 transition">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button onclick="toggleDrawer()" class="md:hidden p-2 rounded-full bg-blue-600 text-white hover:bg-blue-700 transition">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Floating Route Info Box -->
    <div id="floating-route-info" class="hidden absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white dark:bg-gray-800 px-6 py-3 rounded-full shadow-2xl z-50 text-center font-bold border-2 border-green-500 w-[90%] md:w-auto flex items-center justify-between">
        <span id="route-text" class="text-green-700 dark:text-green-400"></span>
        <button onclick="clearRoute()" class="ml-4 text-red-500 hover:text-red-700 bg-red-100 dark:bg-red-900/30 px-3 py-1 rounded-full">
            <i class="fa-solid fa-times mr-1"></i> Cancel
        </button>
    </div>

    <!-- Sidebar / Drawer -->
    <div id="sidebar" class="absolute top-16 left-0 w-96 h-[calc(100vh-4rem)] bg-white shadow-2xl flex flex-col md:transform-none open">
        
        <div class="md:hidden w-full flex justify-center py-2" onclick="toggleDrawer()">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
        </div>

        <div class="p-4 border-b dark:border-gray-700">
            <input type="text" id="searchInput" placeholder="Search Canteen, Admin..." 
                class="w-full p-3 rounded-xl border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-blue-500 transition mb-3"
                onkeyup="filterLocations()">
        </div>

        <!-- Location List / Details -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4">
            <div id="locationList" class="space-y-3"></div>
            <div id="locationDetails" class="hidden h-full flex flex-col">
                <button onclick="showList()" class="mb-4 text-blue-600 dark:text-blue-400 font-semibold hover:underline">
                    <i class="fa-solid fa-arrow-left mr-2"></i>Back to list
                </button>
                <h2 id="detailTitle" class="text-2xl font-bold mb-2"></h2>
                <span id="detailCategory" class="text-sm font-bold px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md w-max mb-4"></span>
                <p id="detailDesc" class="text-gray-600 dark:text-gray-300 mb-4"></p>
                
                <h3 class="font-bold mb-2 border-b pb-1 dark:border-gray-700">Facilities</h3>
                <div id="detailFacilities" class="flex flex-wrap gap-2 mb-6"></div>
                
                <div class="mt-auto">
                    <!-- The Start Button you requested -->
                    <button id="routeBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 shadow-md">
                        <i class="fa-solid fa-play mr-2"></i>Start Route Here
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- 1. Map Initialization (Locked to Campus) ---
        const map = L.map('map', { zoomControl: false }).setView([6.9015, 79.8600], 17);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Map Lock (Campus Bounds)
        const campusBounds = L.latLngBounds(
            L.latLng(6.896, 79.855),
            L.latLng(6.906, 79.865) 
        );
        map.setMaxBounds(campusBounds);
        map.on('drag', function() { map.panInsideBounds(campusBounds, { animate: false }); });

        // --- 2. Map Layers ---
        const streetsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, minZoom: 16, subdomains:['mt0','mt1','mt2','mt3'] }).addTo(map);
        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, minZoom: 16, subdomains:['mt0','mt1','mt2','mt3'] });
        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, minZoom: 16 });

        let currentLayer = 'streets';
        function toggleLayers() {
            map.removeLayer(streetsLayer); map.removeLayer(satelliteLayer); map.removeLayer(darkLayer);
            if (currentLayer === 'streets') { satelliteLayer.addTo(map); currentLayer = 'satellite'; } 
            else if (currentLayer === 'satellite') { darkLayer.addTo(map); currentLayer = 'dark'; } 
            else { streetsLayer.addTo(map); currentLayer = 'streets'; }
        }

        // --- 3. User Location Tracker (Default: Admin Office) ---
        let userLat = 6.9015; // Admin Office latitude
        let userLng = 79.8590; // Admin Office longitude
        
        // GPS Tracking (If available on phone, it will update automatically)
        map.locate({setView: false, watch: true, enableHighAccuracy: true});
        map.on('locationfound', function(e) {
            userLat = e.latlng.lat;
            userLng = e.latlng.lng;
        });

        // --- 4. Locations Data (Added Admin & Canteen) ---
        const locations = [
            { id: 1, lat: 6.9015, lng: 79.8590, name: "Admin Office", category: "Admin", desc: "Main administration block.", facilities: ["Offices", "Inquiry"] },
            { id: 2, lat: 6.9030, lng: 79.8610, name: "Main Canteen", category: "Services", desc: "Student cafeteria and food court.", facilities: ["Food", "Drinks", "Seating"] },
            { id: 3, lat: 6.9012, lng: 79.8595, name: "Student Service Centre", category: "Services", desc: "Main student inquiries.", facilities: ["Inquiry Desk"] },
            { id: 7, lat: 6.9025, lng: 79.8590, name: "Chemistry Lecture Theatre", category: "Academic", desc: "Main lecture hall.", facilities: ["Projector"] },
            { id: 21, lat: 6.9025, lng: 79.8620, name: "UCSC Building", category: "Academic", desc: "School of Computing.", facilities: ["Labs", "Library"] }
        ];

        // Draw Markers
        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b>`);
            marker.on('click', () => openDetail(loc));
        });

        function renderList(data) {
            const listEl = document.getElementById('locationList');
            listEl.innerHTML = '';
            data.forEach(loc => {
                const item = document.createElement('div');
                item.className = "p-4 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 border shadow-sm";
                item.innerHTML = `<h3 class="font-bold">${loc.name}</h3><span class="text-xs text-blue-500">${loc.category}</span>`;
                item.onclick = () => { map.flyTo([loc.lat, loc.lng], 18); openDetail(loc); };
                listEl.appendChild(item);
            });
        }

        function filterLocations() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = locations.filter(loc => loc.name.toLowerCase().includes(term));
            renderList(filtered);
        }

        function openDetail(loc) {
            document.getElementById('locationList').classList.add('hidden');
            document.getElementById('locationDetails').classList.remove('hidden');
            document.getElementById('detailTitle').innerText = loc.name;
            document.getElementById('detailCategory').innerText = loc.category;
            document.getElementById('detailDesc').innerText = loc.desc;
            
            document.getElementById('detailFacilities').innerHTML = loc.facilities.map(f => `<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">${f}</span>`).join('');
            
            // Attach Start Route action
            document.getElementById('routeBtn').onclick = () => showRoute(loc.lat, loc.lng);
            document.getElementById('sidebar').classList.add('open');
        }

        function showList() {
            document.getElementById('locationDetails').classList.add('hidden');
            document.getElementById('locationList').classList.remove('hidden');
        }

        function toggleDrawer() { document.getElementById('sidebar').classList.toggle('open'); }

        // --- 5. Routing Logic (Draws path from Admin/GPS to Selected Place) ---
        let routingControl = null;

        window.showRoute = function(destLat, destLng) {
            if (routingControl) { map.removeControl(routingControl); }
            
            document.getElementById('floating-route-info').classList.remove('hidden');
            document.getElementById('route-text').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> පාර හොයමින් පවතී...';

            routingControl = L.Routing.control({
                waypoints: [ L.latLng(userLat, userLng), L.latLng(destLat, destLng) ],
                router: L.Routing.osrmv1({ language: 'en', profile: 'foot' }), // Walking path inside campus
                lineOptions: { styles: [{color: '#16a34a', opacity: 0.9, weight: 6}] }, // Green line
                fitSelectedRoutes: true, 
                show: false, addWaypoints: false,
                createMarker: function(i, wp, nWps) {
                    // Only show marker for destination if needed, or hide them
                    return null; 
                }
            }).on('routesfound', function(e) {
                let summary = e.routes[0].summary;
                let dist = summary.totalDistance < 1000 ? Math.round(summary.totalDistance) + ' m' : (summary.totalDistance / 1000).toFixed(1) + ' km';
                let time = Math.round(summary.totalTime / 60) + ' min';
                
                document.getElementById('route-text').innerHTML = `🚶 දුර: ${dist} | ⏱️ වෙලාව: ${time}`;
            }).addTo(map);

            // Close sidebar to see the map clearly
            if(window.innerWidth < 768) { document.getElementById('sidebar').classList.remove('open'); }
        };

        window.clearRoute = function() {
            if(routingControl) { map.removeControl(routingControl); }
            document.getElementById('floating-route-info').classList.add('hidden');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            if(document.documentElement.classList.contains('dark')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                if(currentLayer === 'streets') toggleLayers(); toggleLayers();
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                if(currentLayer === 'dark') toggleLayers();
            }
        }

        renderList(locations);
    </script>
</body>
</html>
